<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Artilheiros - ' + ${divisao.nome}">Artilheiros</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="breadcrumb">
        <a href="/">Início</a> /
        <a th:href="@{'/divisao/' + ${divisao.id}}" th:text="${divisao.nome}"></a> / Artilheiros
    </div>
    <h1 th:text="'Artilheiros - ' + ${divisao.nome}">Artilheiros</h1>

    <table>
        <thead>
        <tr><th>#</th><th class="nome-time">Jogador</th><th class="nome-time">Time</th><th>Gols</th></tr>
        </thead>
        <tbody>
        <tr th:each="a, iter : ${artilheiros}">
            <td th:text="${iter.index + 1}">1</td>
            <td class="nome-time" th:text="${a.jogador}">Jogador</td>
            <td class="nome-time" th:text="${a.timeNome}">Time</td>
            <td><strong th:text="${a.totalGols}">0</strong></td>
        </tr>
        <tr th:if="${#lists.isEmpty(artilheiros)}"><td colspan="4">Nenhum gol registrado ainda.</td></tr>
        </tbody>
    </table>
</div>
<footer>Campeonato Municipal de Salão</footer>
</body>
</html>
