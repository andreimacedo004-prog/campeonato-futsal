<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${divisao.nome} + ' - Campeonato'">Divisão</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="breadcrumb"><a href="/">Início</a> / <span th:text="${divisao.nome}"></span></div>
    <h1 th:text="${divisao.nome}">Divisão</h1>

    <p><a th:href="@{'/divisao/' + ${divisao.id} + '/artilheiros'}">🥅 Ver artilheiros da divisão inteira</a></p>

    <div class="cards">
        <div class="card" th:each="g : ${grupos}">
            <h3 th:text="${g.nome}">Chave</h3>
            <p th:text="${#lists.size(g.times)} + ' time(s)'">times</p>
            <a class="btn" th:href="@{'/grupo/' + ${g.id}}">Ver jogos e classificação</a>
        </div>
        <p th:if="${#lists.isEmpty(grupos)}">Nenhuma chave cadastrada nesta divisão ainda.</p>
    </div>
</div>
<footer>Campeonato Municipal de Salão</footer>
</body>
</html>
